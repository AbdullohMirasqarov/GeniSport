services:
  - type: web
    name: genisport
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BACKUP_BOT_TOKEN
        sync: false
      - key: BACKUP_CHAT_ID
        sync: false
      - key: RESTORE_KEY
        generateValue: true
      - key: GENISPORT_SECRET_KEY
        generateValue: true
